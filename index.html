<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
👑 Revenant v2
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header class="header">


<h1>
👑 REVENANT 
<span>
v2
</span>
</h1>


</header>



<nav class="menu">


<button onclick="showPage('calculatorPage')">
📦 Калькулятор
</button>


<button onclick="showPage('statisticsPage')">
📊 Статистика
</button>


<button onclick="showPage('historyPage')">
📜 Історія
</button>


<button onclick="showPage('ownerPage')">
👑 Власник
</button>


</nav>
<!-- ======================================== -->
<!-- CALCULATOR PAGE -->
<!-- ======================================== -->


<section
id="calculatorPage"
class="page active-page">


<div class="card">


<h2>
📦 Калькулятор зарплати
</h2>



<div class="input-group">

<label>
Нік працівника
</label>


<input
id="workerNickname"
type="text"
placeholder="Введіть нік">

</div>




<div class="products-grid">



<div class="input-group">

<label>
Алкоголь ⭐⭐
</label>


<input
id="alcohol2"
type="number"
min="0"
value="0">

</div>




<div class="input-group">

<label>
Алкоголь ⭐⭐⭐
</label>


<input
id="alcohol3"
type="number"
min="0"
value="0">

</div>




<div class="input-group">

<label>
Петрушка ⭐⭐
</label>


<input
id="parsley2"
type="number"
min="0"
value="0">

</div>




<div class="input-group">

<label>
Петрушка ⭐⭐⭐
</label>


<input
id="parsley3"
type="number"
min="0"
value="0">

</div>



</div>





<div class="salary-card">


<span>
💰 Зарплата
</span>


<h1 id="salary">
0 грн
</h1>


</div>





<div class="buttons">


<button id="calculateBtn">
🧮 Розрахувати
</button>



<button id="saveBtn">
💾 Зберегти здачу
</button>


</div>




<div
id="calculatorMessage"
class="message">

</div>




</div>


</section>
<!-- ======================================== -->
<!-- STATISTICS PAGE -->
<!-- ======================================== -->


<section
id="statisticsPage"
class="page">



<div class="card">


<h2>
📊 Статистика Revenant
</h2>




<div class="stats-grid">



<div class="stat-card">

<h3>
👥 Працівники
</h3>

<p id="statWorkers">
0
</p>

</div>




<div class="stat-card">

<h3>
📦 Продукція
</h3>

<p id="statProducts">
0
</p>

</div>




<div class="stat-card">

<h3>
💰 Зароблено
</h3>

<p id="statMoney">
0 грн
</p>

</div>




<div class="stat-card">

<h3>
📈 Здачі
</h3>

<p id="statDeliveries">
0
</p>

</div>



</div>





<div class="top-box">


<h2>
🏆 ТОП працівників
</h2>



<div id="topWorkers">

</div>



</div>



</div>



</section>
<!-- ======================================== -->
<!-- HISTORY PAGE -->
<!-- ======================================== -->


<section
id="historyPage"
class="page">



<div class="card">


<h2>
📜 Історія здач
</h2>



<div id="historyList">


</div>



</div>


</section>
<!-- ======================================== -->
<!-- OWNER PAGE -->
<!-- ======================================== -->


<section
id="ownerPage"
class="page">



<div class="card">



<h2>
👑 Панель власника
</h2>




<div id="ownerLoginBox">



<input
id="ownerPassword"
type="password"
placeholder="🔐 Пароль власника">



<button id="ownerLoginBtn">

🔓 Увійти

</button>



</div>






<div id="ownerPanel"
style="display:none;">





<h3>
👥 Працівники
</h3>



<div class="owner-box">



<input
id="newWorkerName"
placeholder="Нік нового працівника">



<button id="addWorkerBtn">

➕ Додати працівника

</button>



</div>







<h3>
💰 Зміна цін
</h3>




<div class="prices-grid">



<input
id="priceAlcohol2"
type="number"
placeholder="Алкоголь ⭐⭐">



<input
id="priceAlcohol3"
type="number"
placeholder="Алкоголь ⭐⭐⭐">



<input
id="priceParsley2"
type="number"
placeholder="Петрушка ⭐⭐">



<input
id="priceParsley3"
type="number"
placeholder="Петрушка ⭐⭐⭐">



</div>




<button id="savePricesBtn">

💾 Зберегти ціни

</button>







<h3>
⚙️ Керування
</h3>



<button id="clearHistoryBtn">

🗑️ Очистити історію

</button>




<button id="clearTopBtn">

🏆 Очистити ТОП

</button>






<div id="ownerMessage"
class="message">

</div>




</div>





</div>



</section>
<!-- ======================================== -->
<!-- TOAST MESSAGE -->
<!-- ======================================== -->


<div id="toast">

</div>





<!-- ======================================== -->
<!-- SCRIPTS -->
<!-- ======================================== -->


<script type="module" src="script.js"></script>



</body>

</html>
