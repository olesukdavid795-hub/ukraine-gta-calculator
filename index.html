<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Revenant v2</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background"></div>


<header class="header">


<div class="logo">

👑 REVENANT

<span>
v2
</span>

</div>


<button class="mobileBtn">
☰
</button>


<nav>

<a>
Калькулятор
</a>

<a>
Статистика
</a>

<a>
Власник
</a>

</nav>


</header>





<main>



<section class="card calculator">


<h1>
💰 Калькулятор зарплат
</h1>



<div class="grid">



<div class="item">

<label>
Алкоголь ⭐⭐
</label>

<input 
type="number"
id="alcohol2"
value="0">


</div>



<div class="item">

<label>
Алкоголь ⭐⭐⭐
</label>

<input 
type="number"
id="alcohol3"
value="0">


</div>




<div class="item">

<label>
Петрушка ⭐⭐
</label>

<input 
type="number"
id="parsley2"
value="0">


</div>



<div class="item">

<label>
Петрушка ⭐⭐⭐
</label>

<input 
type="number"
id="parsley3"
value="0">


</div>



</div>



<h2>

Разом:

<span id="total">
0 грн
</span>

</h2>



<input
id="playerName"
placeholder="Нік гравця">


<button id="saveSalary">

💾 Зберегти зарплату

</button>



</section>






<section class="card">


<h2>
🏆 ТОП гравців
</h2>


<div id="topPlayers">

</div>


</section>







<section class="card">


<h2>
📜 Історія здачі
</h2>


<div id="history">

</div>


</section>









<section 
class="card owner">



<h2>
👑 Панель власника
</h2>



<input
type="password"
id="ownerPass"
placeholder="Пароль власника">


<button id="ownerLogin">

Увійти

</button>




<div id="ownerPanel" class="hidden">



<h3>
Зміна цін
</h3>



<input
id="priceAlcohol2"
value="900"
placeholder="Алкоголь ⭐⭐">


<input
id="priceAlcohol3"
value="1200"
placeholder="Алкоголь ⭐⭐⭐">


<input
id="priceParsley2"
value="800"
placeholder="Петрушка ⭐⭐">


<input
id="priceParsley3"
value="1100"
placeholder="Петрушка ⭐⭐⭐">



<button id="savePrices">

💾 Зберегти ціни

</button>



<button id="pdfExport">

📤 Експорт PDF

</button>



</div>


</section>




</main>



<div id="toastContainer">

</div>



<script src="script.js"></script>


</body>

</html>
