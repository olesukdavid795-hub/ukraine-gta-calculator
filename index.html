<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>👑 Revenant v2 Ultimate</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="app">


<header class="header">


<div class="logo">

<div class="logo-icon">
👑
</div>


<div>

<h1>
REVENANT
</h1>

<span>
v2 ULTIMATE
</span>

</div>


</div>


<nav class="navigation">


<button class="nav-btn active" data-page="calculator">

📦 Калькулятор

</button>


<button class="nav-btn" data-page="statistics">

📊 Статистика

</button>


<button class="nav-btn" data-page="top">

🏆 ТОП працівників

</button>


<button class="nav-btn" data-page="history">

📜 Історія

</button>


<button class="nav-btn" data-page="owner">

👑 Власник

</button>


</nav>


</header>

<main>

<div id="pages">


<!-- =========================
     📦 КАЛЬКУЛЯТОР
========================= -->

<section 
id="calculator"
class="page active">


<div class="card">


<h2>
📦 Калькулятор здачі
</h2>


<div class="form-group">

<label>
Нік працівника
</label>

<input 
id="workerName"
type="text"
placeholder="Введіть нік працівника">


</div>



<div class="products-grid">



<div class="product-card">

<h3>
🍺 Алкоголь ⭐⭐
</h3>

<input
id="alcohol2"
type="number"
value="0"
min="0">

</div>



<div class="product-card">

<h3>
🍺 Алкоголь ⭐⭐⭐
</h3>

<input
id="alcohol3"
type="number"
value="0"
min="0">

</div>



<div class="product-card">

<h3>
🌿 Петрушка ⭐⭐
</h3>

<input
id="parsley2"
type="number"
value="0"
min="0">

</div>



<div class="product-card">

<h3>
🌿 Петрушка ⭐⭐⭐
</h3>

<input
id="parsley3"
type="number"
value="0"
min="0">

</div>


</div>



<div class="calculator-result">


<h3>
💰 Зарплата
</h3>


<div id="salaryResult">

0 грн

</div>



<button 
id="calculateBtn"
class="btn">

🧮 Розрахувати

</button>



<button
id="saveDeliveryBtn"
class="btn">

💾 Зберегти здачу

</button>


</div>


</div>


</section>



<!-- =========================
     📊 СТАТИСТИКА
========================= -->


<section
id="statistics"
class="page">


<div class="card">


<h2>
📊 Статистика
</h2>


<div id="statisticsBox">

</div>


</div>


</section>




<!-- =========================
     🏆 ТОП
========================= -->


<section
id="top"
class="page">


<div class="card">


<h2>
🏆 ТОП працівників
</h2>


<div id="topWorkers">

</div>


</div>


</section>





<!-- =========================
     📜 ІСТОРІЯ
========================= -->


<section
id="history"
class="page">


<div class="card">


<h2>
📜 Історія здач
</h2>


<div id="historyList">

</div>


</div>


</section>





<!-- =========================
     👑 ВЛАСНИК
========================= -->


<section
id="owner"
class="page">


<div class="card">


<h2>
👑 Панель власника
</h2>


<div id="ownerLogin">


<input
id="ownerPassword"
type="password"
placeholder="Пароль власника">


<button
id="ownerLoginBtn"
class="btn">

🔐 Увійти

</button>


</div>


<div id="ownerPanel"
style="display:none;">


</div>


</div>


</section>



</div>

</main>


<div id="toast">

</div>


</div>


<script type="module" src="script.js"></script>


</body>

</html>
