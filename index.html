<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Revenant v2</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background"></div>



<header class="header">


<div class="logo">

👑 REVENANT

<span>v2</span>

</div>


<nav>

<button>
Калькулятор
</button>

<button>
Статистика
</button>

<button>
Історія
</button>

<button>
Власник
</button>

</nav>


</header>





<main>



<section class="hero">


<h1>
Premium Salary System
</h1>


<p>
Облік продукції • Зарплата • Статистика
</p>


</section>







<section class="card calculator">


<h2>
💰 Калькулятор зарплати
</h2>



<div class="inputs">


<div>

<label>
Нік гравця
</label>

<input 
id="playerName"
placeholder="Введіть нік">


</div>



<div>

<label>
Алкоголь ⭐⭐
</label>

<input 
id="alcohol2"
type="number"
value="0">


</div>



<div>

<label>
Алкоголь ⭐⭐⭐
</label>

<input 
id="alcohol3"
type="number"
value="0">


</div>




<div>

<label>
Петрушка ⭐⭐
</label>

<input 
id="parsley2"
type="number"
value="0">


</div>




<div>

<label>
Петрушка ⭐⭐⭐
</label>

<input 
id="parsley3"
type="number"
value="0">


</div>



</div>





<div class="result">


<h3>
Зарплата:
</h3>


<div id="total">

0 грн

</div>


</div>




<button id="saveSalary">

💾 Зберегти здачу

</button>



</section>









<section class="card">


<h2>
🏆 ТОП ГРАВЦІВ
</h2>


<div id="topPlayers">

Поки немає даних

</div>


</section>








<section class="card">


<h2>
📜 Історія здач
</h2>


<div id="history">

Історія порожня

</div>


</section>









<section class="card">


<h2>
📊 Загальна статистика
</h2>


<div id="statistics">

Немає даних

</div>


</section>









<section class="card owner">


<h2>
👑 Панель власника
</h2>


<input 
type="password"
id="ownerPassword"
placeholder="Пароль">


<button id="ownerLogin">

Увійти

</button>





<div id="ownerPanel" class="hidden">


<h3>
База гравців
</h3>


<input 
id="searchPlayer"
placeholder="Пошук гравця">



<div id="playerProfile">

Профіль не вибрано

</div>




<h3>
Зміна цін
</h3>



<input 
id="priceAlcohol2"
placeholder="Алкоголь ⭐⭐">


<input 
id="priceAlcohol3"
placeholder="Алкоголь ⭐⭐⭐">


<input 
id="priceParsley2"
placeholder="Петрушка ⭐⭐">


<input 
id="priceParsley3"
placeholder="Петрушка ⭐⭐⭐">


<button id="savePrices">

💾 Зберегти ціни

</button>



</div>


</section>





</main>




<div id="toast">

</div>



<script src="script.js"></script>


</body>

</html>
