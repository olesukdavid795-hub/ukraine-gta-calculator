<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Revenant v2</title>

<link rel="stylesheet" href="style.css">

<body>

<div class="product-box">

<h3>

<div class="product-box">

<input
type="number"
id="parsley2"
value="0"
min="0">

<h3>
🌿 Петрушка ⭐⭐⭐
</h3>

<input
type="number"
id="parsley3"
value="0"
min="0">

</div>

<h3>
💰 Зарплата

0 грн

0

</div>

<h3>
📦 Продукція
</h3>

<p id="productsCount">
0
</p>

</div>



<div class="stat-card">

<h3>
💰 Виплачено
</h3>

<p id="moneyCount">
0 грн
</p>

</div>


</div>


<div class="top-box">

<h2>
🏆 ТОП працівників
