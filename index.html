<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Revenant v2</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="toastContainer"></div>


<header class="topbar">
<div class="sideMenu">

   <button 
class="menuBtn active"
onclick="openSection('dashboard')">

🏠 Dashboard

</button>


<button 
class="menuBtn"
onclick="openSection('users')">

👥 Users

</button>


<button 
class="menuBtn"
onclick="openSection('logs')">

📜 Logs

</button>


<button 
class="menuBtn"
onclick="openSection('settings')">

⚙ Settings

</button>
</div>


<div class="liveStatus">

    <span>
        ● ONLINE
    </span>

    <b id="liveClock">
        00:00:00
    </b>

</div>
    <div class="logo">
        REVENANT <span>v2</span>
    </div>

    <button id="toggleDark">
        ◐
    </button>

</header>



<main>


<section class="card" id="ownerLogin">

<h2>Owner Access</h2>

<input 
type="password"
id="ownerPassword"
placeholder="Пароль власника">


<button id="ownerLoginBtn">
Увійти
</button>


</section>




<section 
class="card hidden"
id="ownerPanel">


<h1>
OWNER PANEL
</h1>


<div class="stats">


<div class="stat">

<span>Користувачі</span>

<b id="statUsers">
0
</b>

</div>


<div class="stat">

<span>Логи</span>

<b id="statLogs">
0
</b>

</div>


<div class="stat">

<span>Версія</span>

<b id="statVersion">
0
</b>

</div>


</div>



<div class="ownerBox">


<h2>
Створити користувача
</h2>


<input 
id="newUserName"
placeholder="Ім'я">


<select id="newUserRole">

<option>
Admin
</option>

<option>
Moderator
</option>

<option>
Player
</option>


</select>


<button id="createUserBtn">
Створити
</button>


</div>




<div class="ownerBox">

<h2>
Користувачі
</h2>


<table>


<thead>

<tr>

<th>
Ім'я
</th>


<th>
Роль
</th>


<th>
Дата
</th>


<th>
Дія
</th>

</tr>


</thead>


<tbody id="ownerUsers">

</tbody>


</table>


</div>




<div class="ownerBox">


<h2>
Система логів
</h2>


<div id="ownerLogs">

</div>


</div>


<div class="ownerBox profileBox">

<h2>
👤 Mafia Profile
</h2>


<div class="profile">

<div>
Rank:
<b id="playerRank">
Novice
</b>
</div>


<div>
Level:
<b id="playerLevel">
1
</b>
</div>


<div>
XP:
<b id="playerXP">
0
</b>
</div>


<div>
Status:
<b id="playerStatus">
Active
</b>
</div>


</div>


<button id="addXP">
+100 XP
</button>


</div>
   
<div class="ownerBox mafiaStats">

<h2>
💰 Mafia Statistics
</h2>


<div class="statsGrid">


<div class="stat">
<span>Гроші</span>
<b id="money">
0 ₴
</b>
</div>


<div class="stat">
<span>Авторитет</span>
<b id="respect">
0</b>
</div>


<div class="stat">
<span>Злочини</span>
<b id="crimes">
0</b>
</div>


<div class="stat">
<span>Фракція</span>
<b id="faction">
Без фракції
</b>
</div>


</div>


<button id="crimeBtn">
Здійснити злочин
</button>


</div>

<button id="logoutOwner">
Вийти
</button>



</section>


</main>



<script src="script.js"></script>


</body>

</html>
